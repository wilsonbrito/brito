name: test
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Empacotar só quando o app muda: os bugs de 0.20.1/0.20.2 (SLM fora do app, symlinks no macOS) só apareciam depois da tag.
  package-smoke:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD | grep -qE '^(desktop/|package(-lock)?\.json|build-bundle\.mjs|src/desktop)'; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v7
        with: { node-version: 22 }
      - if: steps.changed.outputs.run == 'true'
        run: npm ci && npm run bundle && npm --prefix desktop ci
      - if: steps.changed.outputs.run == 'true'
        run: node desktop/package.mjs
      - if: steps.changed.outputs.run == 'true'
        run: node desktop/verify-package.mjs

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; worker-src 'self'" />
  <title>Brito</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="drag"></div>
      <div class="tabs"><span class="tab on">SESSÕES</span></div>
      <button class="nav" id="new-session"><span class="ico">✎</span> Nova sessão <kbd>⌘N</kbd></button>
      <input id="search" placeholder="Buscar sessões…" autocomplete="off" />
      <div class="section"><span>PROJETOS</span><button id="add-project" title="Adicionar pasta">＋</button></div>
      <div id="projects"></div>
      <button id="theme-btn" title="Alternar tema (sistema → claro → escuro)">◐ Tema</button>
      <button id="settings-btn" title="Configurações e consumo do plano">⚙ Configurar</button>
    </aside>
    <main>
      <header id="topbar"><span id="title">Brito</span><span id="meta"></span>
        <nav id="panel-btns"><button data-panel="skills">Skills</button><button data-panel="agents">Agentes</button><button data-panel="graph">Grafo</button><button data-panel="memory">Memória</button><button data-panel="files">Arquivos</button></nav>
      </header>
      <section id="panel" hidden>
        <div id="panel-head"><div id="panel-tabs"></div><input id="panel-q" placeholder="Buscar…" autocomplete="off" /><button id="panel-x" title="Fechar (Esc)">✕</button></div>
        <div id="panel-body"></div>
      </section>
      <section id="chat"><div id="messages"></div></section>
      <footer>
        <div id="todos" hidden></div>
        <div id="pop" hidden></div>
        <div id="composer">
          <textarea id="input" rows="1" placeholder="O que vamos construir?"></textarea>
          <div id="controls">
            <select id="mode" title="Permissões">
              <option value="manual">Perguntar</option>
              <option value="auto">Editar sozinho</option>
              <option value="plan">Planejar</option>
              <option value="bypass">Tudo liberado</option>
            </select>
            <select id="model" title="Modelo">
              <option value="">Padrão</option>
              <option value="fable">Fable</option>
              <option value="opus">Opus</option>
              <option value="sonnet">Sonnet</option>
              <option value="haiku">Haiku</option>
            </select>
            <select id="orch" title="Quem escreve o código. O modelo escolhido planeja e revisa; com Qwen, ele escreve o código no seu endpoint (poupa tokens do Claude)">
              <option value="">Código: o próprio modelo (usa tokens)</option>
              <option value="on">Código: Qwen (poupa tokens)</option>
            </select>
            <select id="effort" title="Esforço de raciocínio">
              <option value="">Auto</option>
              <option value="low">Baixo</option>
              <option value="medium">Médio</option>
              <option value="high">Alto</option>
              <option value="max">Máx</option>
            </select>
            <button id="send" title="Enviar (Enter)">↑</button>
          </div>
        </div>
        <div id="status"><span id="st-backend"></span><span id="st-dir"></span><span id="st-usage"></span></div>
      </footer>
    </main>
  </div>
  <div id="modal" hidden><div class="card">
    <h3>Permissão</h3><pre id="modal-text"></pre>
    <div class="row"><button id="deny">Negar</button><button id="allow-project" title="Lembrar para este projeto">Sempre neste projeto</button><button id="allow-session" title="Não perguntar de novo para este tipo de ação nesta sessão">Permitir nesta sessão</button><button id="allow" class="primary">Permitir</button></div>
  </div></div>
  <div id="palette" hidden><div id="pal-box"><input id="pal-in" placeholder="Digite um comando ou o nome de uma sessão…" autocomplete="off" /><div id="pal-list"></div></div></div>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
  <script src="panels.js"></script>
  <script src="preview.js"></script>
  <script src="extras.js"></script>
</body>
</html>
